<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>مطعم جنين | تسجيل الدخول</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main
        style="
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
        "
    >

        <div
            style="
                width:100%;
                max-width:430px;
                background:#191714;
                padding:35px;
                border-radius:20px;
                border:1px solid rgba(214,168,79,.25);
                box-shadow:0 20px 60px rgba(0,0,0,.5);
            "
        >

            <div style="text-align:center;margin-bottom:30px;">

                <div
                    style="
                        font-size:42px;
                        margin-bottom:10px;
                    "
                >
                    🍽️
                </div>

                <h1
                    style="
                        color:#f1d58a;
                        margin:0 0 10px;
                    "
                >
                    مطعم جنين
                </h1>

                <p style="color:#aaa49a;margin:0;">
                    لوحة تحكم الإدارة
                </p>

            </div>


            <form id="loginForm">

                <label
                    style="
                        display:block;
                        color:#f8f5ee;
                        margin-bottom:8px;
                    "
                >
                    البريد الإلكتروني
                </label>

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="أدخل البريد الإلكتروني"
                    required
                    style="
                        width:100%;
                        box-sizing:border-box;
                        padding:14px;
                        margin-bottom:18px;
                        border-radius:10px;
                        border:1px solid #3a352d;
                        background:#0d0c0a;
                        color:#fff;
                        font-family:inherit;
                    "
                >


                <label
                    style="
                        display:block;
                        color:#f8f5ee;
                        margin-bottom:8px;
                    "
                >
                    كلمة المرور
                </label>

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="أدخل كلمة المرور"
                    required
                    style="
                        width:100%;
                        box-sizing:border-box;
                        padding:14px;
                        margin-bottom:20px;
                        border-radius:10px;
                        border:1px solid #3a352d;
                        background:#0d0c0a;
                        color:#fff;
                        font-family:inherit;
                    "
                >


                <button
                    type="submit"
                    style="
                        width:100%;
                        padding:14px;
                        border:0;
                        border-radius:10px;
                        background:linear-gradient(
                            135deg,
                            #d6a84f,
                            #f1d58a
                        );
                        color:#0d0c0a;
                        font-size:16px;
                        font-weight:bold;
                        cursor:pointer;
                        font-family:inherit;
                    "
                >
                    🔐 تسجيل الدخول
                </button>


                <p
                    id="loginMessage"
                    style="
                        text-align:center;
                        margin-top:18px;
                        min-height:24px;
                    "
                ></p>

            </form>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const SUPABASE_URL =
            "https://umypydotylxxdgpofqfn.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_VIoDDn2SB5qQM0YUa0-1hg_zrdthjm2";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const loginMessage =
            document.getElementById(
                "loginMessage"
            );


        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document.getElementById(
                        "loginEmail"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "loginPassword"
                    ).value;


                loginMessage.textContent =
                    "جاري تسجيل الدخول...";

                loginMessage.style.color =
                    "#f1d58a";


                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });


                if (error) {

                    console.error(
                        "Login error:",
                        error
                    );

                    loginMessage.textContent =
                        "❌ البريد الإلكتروني أو كلمة المرور غير صحيحة";

                    loginMessage.style.color =
                        "#ff6b6b";

                    return;
                }


                console.log(
                    "Login successful:",
                    data
                );


                loginMessage.textContent =
                    "✅ تم تسجيل الدخول بنجاح";

                loginMessage.style.color =
                    "#7ee787";


                setTimeout(
                    function() {

                        window.location.href =
                            "admin-dashboard.html";

                    },
                    800
                );

            }
        );

    </script>

</body>

</html>
